# Percona registry aliases for OpenShift
# The Percona MongoDB Operator uses Docker Hub short image names (e.g. percona/mongodb_exporter)
# which OpenShift rejects. This MachineConfig adds aliases so OCP resolves them to docker.io.
# Apply once per cluster: oc apply -f percona-registry-aliases.yaml
# Note: this triggers a node reboot.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-percona-registry-aliases
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/containers/registries.conf.d/003-percona-aliases.conf
          mode: 0644
          contents:
            source: data:text/plain;charset=utf-8;base64,
