# OpenShift-specific values override — monitoring only
# Use with: helm install ... --values values-ocp.yaml
#
# To enable fault remediation (cordon/drain), also pass:
#   --values values-ocp-remediation.yaml
#
# For Single Node OpenShift (SNO), also add:
#   --values values-ocp-sno.yaml

global:
  openshift:
    enabled: true
  dcgm:
    service:
      endpoint: "nvidia-dcgm.nvidia-gpu-operator.svc"

openshift:
  enabled: true

labeler:
  assumeDriverInstalled: true
